<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="QR Scanner" />
  <title>QR Scanner</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --green: #00ff88;
      --green-dim: rgba(0,255,136,0.12);
      --green-glow: rgba(0,255,136,0.35);
      --text: #e8e8f0;
      --muted: #55556a;
      --danger: #ff4466;
      --mono: 'Share Tech Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ── Noise overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* ── Screens ── */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 1;
    }
    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.97);
    }

    /* ── Home screen ── */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 48px;
    }
    .logo-icon {
      width: 72px;
      height: 72px;
      position: relative;
      margin-bottom: 8px;
    }
    .logo-icon svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 12px var(--green-glow));
    }
    .logo-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .logo-sub {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .btn-start {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 16px;
      padding: 18px 36px;
      font-family: var(--sans);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 0 24px var(--green-glow), 0 4px 16px rgba(0,0,0,0.4);
      letter-spacing: 0.3px;
    }
    .btn-start:active { transform: scale(0.96); box-shadow: 0 0 12px var(--green-glow); }
    .btn-start svg { flex-shrink: 0; }

    .scan-count-badge {
      margin-top: 20px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }
    .scan-count-badge span {
      color: var(--green);
      font-weight: bold;
    }

    /* ── Camera screen ── */
    #cameraScreen {
      padding: 0;
      background: #000;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .camera-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* Viewfinder */
    .viewfinder {
      width: min(72vw, 280px);
      height: min(72vw, 280px);
      position: relative;
    }
    .viewfinder::before, .viewfinder::after,
    .vf-bl, .vf-br {
      content: '';
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: var(--green);
      border-style: solid;
    }
    .viewfinder::before { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .viewfinder::after  { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .vf-bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .vf-br { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    /* Scan line */
    .scan-line {
      position: absolute;
      left: 4px; right: 4px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
      box-shadow: 0 0 8px var(--green-glow);
      animation: scanAnim 2s ease-in-out infinite;
      top: 0;
    }
    @keyframes scanAnim {
      0%   { top: 4px; opacity: 1; }
      50%  { opacity: 0.6; }
      100% { top: calc(100% - 6px); opacity: 1; }
    }

    .camera-hint {
      margin-top: 28px;
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Accumulated label */
    .cam-acc-label {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 14px 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--green);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cam-acc-label .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.2s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    .btn-cancel-cam {
      position: absolute;
      bottom: 32px;
      pointer-events: all;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      border-radius: 50px;
      padding: 12px 28px;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .btn-cancel-cam:active { opacity: 0.7; }

    /* ── Result screen ── */
    #resultScreen {
      justify-content: flex-start;
      overflow-y: auto;
      padding: 32px 20px 40px;
      gap: 0;
    }

    .result-header {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .result-header-icon {
      width: 36px; height: 36px;
      background: var(--green-dim);
      border: 1px solid var(--green);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .result-header-icon svg { color: var(--green); }
    .result-header-text h2 {
      font-size: 18px; font-weight: 800;
    }
    .result-header-text p {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 1px;
    }

    .data-box {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      position: relative;
    }
    .data-box-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .data-box-content {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text);
      line-height: 1.7;
      word-break: break-all;
      white-space: pre-wrap;
      max-height: 160px;
      overflow-y: auto;
    }
    .data-box-content::-webkit-scrollbar { width: 3px; }
    .data-box-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .scan-stats {
      width: 100%;
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    .stat-chip {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
    }
    .stat-chip .val {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: bold;
      color: var(--green);
    }
    .stat-chip .lbl {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Action buttons */
    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-action {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      text-align: left;
    }
    .btn-action:active { transform: scale(0.98); }
    .btn-action .icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .btn-action .arrow {
      margin-left: auto;
      color: var(--muted);
    }

    .btn-action.primary {
      background: var(--green-dim);
      border-color: var(--green);
      color: var(--green);
    }
    .btn-action.primary .icon { background: rgba(0,255,136,0.15); }
    .btn-action.primary:active { background: rgba(0,255,136,0.2); }

    .btn-action.default .icon { background: rgba(255,255,255,0.05); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface);
      border: 1px solid var(--green);
      color: var(--green);
      font-family: var(--mono);
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 50px;
      z-index: 999;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
      opacity: 0;
      white-space: nowrap;
      letter-spacing: 0.5px;
      box-shadow: 0 0 16px var(--green-glow);
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Flash effect on scan detect */
    .flash {
      position: fixed;
      inset: 0;
      background: var(--green);
      opacity: 0;
      pointer-events: none;
      z-index: 500;
    }
    .flash.go {
      animation: flashAnim 0.35s ease forwards;
    }
    @keyframes flashAnim {
      0%   { opacity: 0.35; }
      100% { opacity: 0; }
    }

    /* hidden canvas for QR decode */
    #canvas { display: none; }
  </style>
</head>
<body>

<!-- Flash overlay -->
<div class="flash" id="flash"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ══════════ HOME SCREEN ══════════ -->

        <rect x="42" y="42" width="10" height="10" rx="1" fill="#00ff88"/>

        </svg>
      </div>
      Start Fresh Session
      <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

<!-- jsQR loaded from CDN, cached by SW -->
<script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
  // ── State ──
  let accumulatedData = '';
  let scanCount = 0;
  let stream = null;
  let rafId = null;
  let scanning = false;
  let lastCode = '';
  let lastCodeTime = 0;
  const DEBOUNCE_MS = 2000; // ignore same QR for 2s

  // ── DOM refs ──
  const homeScreen    = document.getElementById('homeScreen');
  const cameraScreen  = document.getElementById('cameraScreen');
  const resultScreen  = document.getElementById('resultScreen');
  const video         = document.getElementById('video');
  const canvas        = document.getElementById('canvas');
  const ctx           = canvas.getContext('2d', { willReadFrequently: true });
  const flash         = document.getElementById('flash');
  const toast         = document.getElementById('toast');

  // ── Service Worker ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(console.warn);
  }

  // ── Screen transitions ──
  function showScreen(screen) {
    [homeScreen, cameraScreen, resultScreen].forEach(s => s.classList.add('hidden'));
    screen.classList.remove('hidden');
  }

  // ── Toast ──
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ── Flash ──
  function doFlash() {
    flash.classList.remove('go');
    void flash.offsetWidth; // reflow
    flash.classList.add('go');
  }

  // ── Camera ──
  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = stream;
      await new Promise(res => video.onloadedmetadata = res);
      scanning = true;
      tick();
    } catch (e) {
      showToast('Camera access denied');
      showScreen(homeScreen);
    }
  }

  function stopCamera() {
    scanning = false;
    cancelAnimationFrame(rafId);
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    video.srcObject = null;
  }

  function tick() {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: 'dontInvert'
      });
      if (code) {
        const now = Date.now();
        if (code.data !== lastCode || now - lastCodeTime > DEBOUNCE_MS) {
          lastCode = code.data;
          lastCodeTime = now;
          onCodeDetected(code.data);
          return;
        }
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  function onCodeDetected(data) {
    scanning = false;
    cancelAnimationFrame(rafId);
    stopCamera();
    doFlash();

    // Append exactly as-is, no padding
    accumulatedData += data;
    scanCount++;

    updateResultScreen();
    showScreen(resultScreen);
  }

  // ── Result screen update ──
  function updateResultScreen() {
    document.getElementById('resultData').textContent = accumulatedData;
    document.getElementById('statScans').textContent  = scanCount;
    document.getElementById('statChars').textContent  = accumulatedData.length;
    document.getElementById('resultSubtitle').textContent =
      `${scanCount} scan${scanCount !== 1 ? 's' : ''} · ${accumulatedData.length} chars`;
  }

  // ── Open camera to scan (possibly continuing) ──
  function openCameraForScan(isContinuing) {
    const label  = document.getElementById('camAccLabel');
    const labelT = document.getElementById('camAccText');
    if (isContinuing && accumulatedData.length > 0) {
      label.style.display = 'flex';
      const preview = accumulatedData.length > 30
        ? '…' + accumulatedData.slice(-30)
        : accumulatedData;
      labelT.textContent = `Appending to: "${preview}"`;
    } else {
      label.style.display = 'none';
    }
    lastCode = '';
    lastCodeTime = 0;
    showScreen(cameraScreen);
    startCamera();
  }

  // ── Button handlers ──
  document.getElementById('btnStart').addEventListener('click', () => {
    accumulatedData = '';
    scanCount = 0;
    openCameraForScan(false);
  });

  document.getElementById('btnCancelCam').addEventListener('click', () => {
    stopCamera();
    if (scanCount > 0) {
      showScreen(resultScreen);
    } else {
      showScreen(homeScreen);
    }
  });

  document.getElementById('btnContinueScan').addEventListener('click', () => {
    openCameraForScan(true);
  });

  document.getElementById('btnNewSession').addEventListener('click', () => {
    accumulatedData = '';
    scanCount = 0;
    showScreen(homeScreen);
  });

  // Save as .txt
  document.getElementById('btnSave').addEventListener('click', () => {
    if (!accumulatedData) return showToast('Nothing to save');
    const blob = new Blob([accumulatedData], { type: 'text/plain' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `qr-scan-${Date.now()}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('File saved!');
  });

  // Share
  document.getElementById('btnShare').addEventListener('click', async () => {
    if (!accumulatedData) return showToast('Nothing to share');
    if (navigator.share) {
      try {
        await navigator.share({ title: 'QR Scan Data', text: accumulatedData });
      } catch (e) {
        if (e.name !== 'AbortError') showToast('Share failed');
      }
    } else {
      // Fallback: copy and notify
      await copyToClipboard();
      showToast('Copied (Share not supported on this browser)');
    }
  });

  // Copy
  document.getElementById('btnCopy').addEventListener('click', async () => {
    await copyToClipboard();
    showToast('Copied to clipboard!');
  });

  async function copyToClipboard() {
    if (!accumulatedData) return showToast('Nothing to copy');
    try {
      await navigator.clipboard.writeText(accumulatedData);
    } catch {
      // Fallback
      const ta = document.createElement('textarea');
      ta.value = accumulatedData;
      ta.style.position = 'fixed';
      ta.style.opacity  = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
  }
</script>
</body>
</html>
